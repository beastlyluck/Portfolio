<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atharva Khaire | Data Science Portfolio</title>
    <!-- Tailwind via CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script defer src="https://unpkg.com/three@0.165.0/build/three.min.js"></script>
    <!-- Font for UI headings -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body,html{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0b1120;color:#f3f4f6;}
        #bg{position:fixed;top:0;left:0;width:100%;height:100%;display:block;z-index:-1;}
        #ui{position:relative;z-index:1;pointer-events:none;}
        .card{pointer-events:auto;cursor:pointer;transition:transform .3s ease;}
        .card:hover{transform:translateY(-4px) scale(1.03);}        
    </style>
</head>
<body>
    <!-- Three.js canvas (background) -->
    <canvas id="bg"></canvas>

    <!-- UI overlay -->
    <section id="ui" class="h-full flex flex-col justify-center items-center text-center space-y-8 px-4">
        <header>
            <h1 class="text-5xl font-extrabold mb-3">Atharva Khaire</h1>
            <p class="max-w-xl text-lg opacity-80">Data Scientist • Story‑teller • Gamer</p>
        </header>

        <!-- Portfolio cards (each acts as a link) -->
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6 w-full max-w-6xl">
            <a href="projects/project1.html" class="card bg-slate-800/60 backdrop-blur-lg rounded-2xl p-6 shadow-2xl">
                <h2 class="text-2xl font-semibold mb-2">Classification Challenge</h2>
                <p class="text-sm opacity-70">Achieved 0.62 macro‑F1 with stacked XGBoost & SVM.</p>
            </a>
            <a href="projects/project2.html" class="card bg-slate-800/60 backdrop-blur-lg rounded-2xl p-6 shadow-2xl">
                <h2 class="text-2xl font-semibold mb-2">Carbon Odyssey Viz</h2>
                <p class="text-sm opacity-70">Interactive globe & multi‑lens dashboards in D3.</p>
            </a>
            <a href="projects/project3.html" class="card bg-slate-800/60 backdrop-blur-lg rounded-2xl p-6 shadow-2xl">
                <h2 class="text-2xl font-semibold mb-2">Generative AI Bias Audit</h2>
                <p class="text-sm opacity-70">FLoRA platform experiments & mitigation strategies.</p>
            </a>
            <!-- Duplicate/extend cards as needed -->
        </div>
    </section>

    <script>
    /* =====  3‑D BACKGROUND SCENE  ===== */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    /* --- Starfield helper --- */
    function addStar() {
        const geometry = new THREE.SphereGeometry(0.05, 24, 24);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const star = new THREE.Mesh(geometry, material);
        const [x, y, z] = Array(3).fill().map(() => THREE.MathUtils.randFloatSpread(200));
        star.position.set(x, y, z);
        scene.add(star);
    }
    Array(400).fill().forEach(addStar);

    /* --- Rotating cube with initials --- */
    const cubeGeo = new THREE.BoxGeometry();
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff8800, metalness: 0.3, roughness: 0.6 });
    const cube = new THREE.Mesh(cubeGeo, cubeMat);
    cube.scale.set(1.5,1.5,1.5);
    scene.add(cube);

    /* Lighting */
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(5,5,5);
    scene.add(pointLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    /* Animation loop */
    function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.005;
        cube.rotation.y += 0.003;
        renderer.render(scene, camera);
    }
    animate();

    /* Handle resize */
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
