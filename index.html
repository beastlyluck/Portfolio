<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atharva Khaire | Data Science Portfolio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- THREE.js -->
  <script src="https://unpkg.com/three@0.165.0/build/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root{--grad-from:#00c9ff;--grad-to:#9354ff;}
    html,body{margin:0;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#050714;color:#e5e7eb;}
    #bg{position:fixed;inset:0;z-index:-2;}
    .blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.23;pointer-events:none;mix-blend-mode:screen;}
    .blob-purple{background:radial-gradient(circle at 30% 30%,var(--grad-to),transparent 70%);}
    .blob-cyan{background:radial-gradient(circle at 70% 70%,var(--grad-from),transparent 70%);}
    #overlay{position:absolute;top:0;left:0;width:100%;z-index:1;text-align:center;padding-top:4rem;pointer-events:none;transition:opacity .8s ease .5s;}
    .glow{background:linear-gradient(90deg,var(--grad-from),var(--grad-to));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    body:not(.unlocked) #overlay{opacity:0;} body.unlocked #overlay{opacity:1;}
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="blob blob-purple w-[700px] h-[700px] -top-40 -left-40"></div>
  <div class="blob blob-cyan w-[650px] h-[650px] -bottom-40 -right-40"></div>

  <div id="overlay">
    <h1 class="text-6xl font-extrabold glow drop-shadow-md">Atharva Khaire</h1>
    <p class="mt-2 text-lg opacity-80">Data Scientist • Story‑teller • Gamer</p>
  </div>

  <script>
    // Ensure init runs exactly once after DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    function init() {
      /* ---------- CORE THREE.JS SETUP ---------- */
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2.5, 9);

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      /* ---------- LIGHTING ---------- */
      scene.add(new THREE.AmbientLight(0xffffff, 0.25));
      const sunLight = new THREE.PointLight(0xfff199, 1.3, 40);
      scene.add(sunLight);

      /* ---------- SUN (GLOWING BALL) ---------- */
      const sun = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 48, 48),
        new THREE.MeshStandardMaterial({ color: 0xfff5ae, emissive: 0xffd45d, emissiveIntensity: 1 })
      );
      scene.add(sun);
      sunLight.position.copy(sun.position);

      /* ---------- GRID FLOOR ---------- */
      const grid = new THREE.GridHelper(80, 160, 0x222233, 0x222233);
      grid.rotation.x = Math.PI / 2;
      scene.add(grid);

      /* ---------- STARFIELD ---------- */
      const starGeo = new THREE.SphereGeometry(0.04, 6, 6);
      const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      for (let i = 0; i < 350; i++) {
        const star = new THREE.Mesh(starGeo, starMat);
        star.position.set(
          THREE.MathUtils.randFloatSpread(120),
          THREE.MathUtils.randFloatSpread(120),
          THREE.MathUtils.randFloatSpread(120)
        );
        scene.add(star);
      }

      /* ---------- DASHBOARD CARDS ---------- */
      const items = [
        { title: 'Classification\nChallenge', url: 'projects/project1.html', color: '#0ea5e9' },
        { title: 'Carbon\nOdyssey Viz',      url: 'projects/project2.html', color: '#10b981' },
        { title: 'GenAI Bias\nAudit',        url: 'projects/project3.html', color: '#f97316' }
      ];
      const orbitGroup = new THREE.Group();
      scene.add(orbitGroup);
      const planeGeo = new THREE.PlaneGeometry(2.8, 1.6);

      items.forEach((it, idx) => {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 292;
        const ctx = canvas.getContext('2d');
        // background rounded rect
        ctx.fillStyle = it.color; ctx.globalAlpha = 0.85;
        roundRect(ctx, 0, 0, 512, 292, 36, true, false);
        // title
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.font = 'bold 54px Inter';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(it.title, 256, 146, 420);
        const tex = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(planeGeo, mat);
        const angle = (idx / items.length) * Math.PI * 2;
        plane.position.set(Math.cos(angle) * 4.5, 0, Math.sin(angle) * 4.5);
        plane.lookAt(0, 0, 0);
        plane.userData.url = it.url;
        orbitGroup.add(plane);
      });

      function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        ctx.beginPath();
        ctx.moveTo(x + r.tl, y);
        ctx.lineTo(x + w - r.tr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
        ctx.lineTo(x + w, y + h - r.br);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
        ctx.lineTo(x + r.bl, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
        ctx.lineTo(x, y + r.tl);
        ctx.quadraticCurveTo(x, y, x + r.tl, y);
        ctx.closePath();
        if (fill) ctx.fill(); if (stroke) ctx.stroke();
      }

      /* ---------- 3‑D DOOR ---------- */
      const doorGroup = new THREE.Group();
      scene.add(doorGroup);
      const doorWidth = 3, doorHeight = 6;
      doorGroup.position.set(-doorWidth / 2, 0, 4.5); // pivot left edge
      const door = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, doorHeight, 0.2), new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.6, roughness: 0.4 }));
      const outline = new THREE.Mesh(new THREE.BoxGeometry(doorWidth * 0.98, doorHeight * 0.98, 0.22), new THREE.MeshBasicMaterial({ color: 0x00caff, wireframe: true, transparent: true, opacity: 0.4 }));
      doorGroup.add(door); doorGroup.add(outline);

      let doorOpening = false;

      /* ---------- RAYCAST CLICK HANDLER ---------- */
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      window.addEventListener('pointerdown', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(doorOpening ? orbitGroup.children : [door]);
        if (doorOpening) {
          if (intersects.length) {
            const url = intersects[0].object.userData.url;
            if (url) window.open(url, '_self');
          }
        } else if (intersects.length) {
          doorOpening = true;
        }
      });

      /* ---------- ANIMATION LOOP ---------- */
      let gridOffset = 0;
      function animate() {
        requestAnimationFrame(animate);

        // door animation
        if (doorOpening && doorGroup.rotation.y > -Math.PI / 2) {
          doorGroup.rotation.y -= 0.03;
        } else if (doorOpening && !document.body.classList.contains('unlocked')) {
          document.body.classList.add('unlocked');
          setTimeout(() => scene.remove(doorGroup), 1000);
        }

        if (document.body.classList.contains('unlocked')) {
          sun.rotation.y += 0.004;
          orbitGroup.rotation.y += 0.0025;
        }

        gridOffset += 0.002;
        grid.position.y = (gridOffset % 2) - 1;

        renderer.render(scene, camera);
      }
      animate();

      /* ---------- HANDLE RESIZE ---------- */
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
