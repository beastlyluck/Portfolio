<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atharva Khaire | Dat Science Portfolio</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script defer src="https://unpkg.com/three@0.165.0/build/three.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* neon accent gradient */
            --grad-from: #00c9ff;
            --grad-to: #9354ff;
        }
        html,body{margin:0;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#050714;color:#e5e7eb;}
        #bg{position:fixed;inset:0;z-index:-2;}
        /* blurred gradient blobs */
        .blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.23;pointer-events:none;mix-blend-mode:screen;}
        .blob-purple{background:radial-gradient(circle at 30% 30%,var(--grad-to),transparent 70%);} /* top‑left */
        .blob-cyan{background:radial-gradient(circle at 70% 70%,var(--grad-from),transparent 70%);} /* bottom‑right */
        /* UI layer */
        #ui{position:relative;z-index:1;pointer-events:none;}
        .card{pointer-events:auto;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease;background:rgba(17,24,39,.55);backdrop-filter:blur(16px);border:1px solid rgba(148,163,184,.2);box-shadow:0 0 0 1px rgba(0,200,255,.12);}
        .card:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 0 8px 2px rgba(0,200,255,.3);}        
        /* header glow */
        .glow{
            background:linear-gradient(90deg,var(--grad-from),var(--grad-to));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
    </style>
</head>
<body>
    <!-- Three.js canvas (space grid) -->
    <canvas id="bg"></canvas>

    <!-- Decorative gradient blobs -->
    <div class="blob blob-purple w-[700px] h-[700px] -top-40 -left-40"></div>
    <div class="blob blob-cyan w-[600px] h-[600px] -bottom-40 -right-40"></div>

    <!-- UI overlay -->
    <section id="ui" class="h-full flex flex-col justify-center items-center text-center space-y-10 px-4">
        <header>
            <h1 class="text-6xl font-extrabold mb-4 glow drop-shadow-md">Atharva Khaire</h1>
            <p class="max-w-xl text-lg opacity-80">Building data‑driven solutions & immersive visuals.</p>
        </header>

        <!-- Portfolio cards -->
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-6 w-full max-w-6xl">
            <a href="projects/project1.html" class="card rounded-3xl p-8">
                <h2 class="text-2xl font-semibold mb-2">Classification Challenge</h2>
                <p class="text-sm opacity-70">Macro‑F1 0.62 with stacked XGBoost + SVM.</p>
            </a>
            <a href="projects/project2.html" class="card rounded-3xl p-8">
                <h2 class="text-2xl font-semibold mb-2">Carbon Odyssey Viz</h2>
                <p class="text-sm opacity-70">Interactive globe & multi‑lens dashboards in D3.</p>
            </a>
            <a href="projects/project3.html" class="card rounded-3xl p-8">
                <h2 class="text-2xl font-semibold mb-2">Generative AI Bias Audit</h2>
                <p class="text-sm opacity-70">FLoRA experiments & mitigation strategies.</p>
            </a>
        </div>
    </section>

    <script>
    /* =====  3‑D BACKGROUND  ===== */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), antialias:true, alpha:true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    /* Grid of moving lines for "techie" feel */
    const gridHelper = new THREE.GridHelper(60, 120, 0x222233, 0x222233);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);

    /* Wireframe polyhedron */
    const geo = new THREE.IcosahedronGeometry(1.8, 1);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00d8ff, wireframe: true });
    const poly = new THREE.Mesh(geo, mat);
    scene.add(poly);

    /* Distant stars */
    function addStar() {
        const geometry = new THREE.SphereGeometry(0.04, 8, 8);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const star = new THREE.Mesh(geometry, material);
        const [x, y, z] = Array(3).fill().map(() => THREE.MathUtils.randFloatSpread(120));
        star.position.set(x, y, z);
        scene.add(star);
    }
    Array(300).fill().forEach(addStar);

    /* Animation loop */
    let gridOffset = 0;
    function animate() {
        requestAnimationFrame(animate);
        poly.rotation.x += 0.004;
        poly.rotation.y += 0.006;
        gridOffset += 0.002;
        gridHelper.material.opacity = 0.35;
        gridHelper.position.y = (gridOffset % 2) - 1; // subtle float
        renderer.render(scene, camera);
    }
    animate();

    /* Responsive resize */
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
